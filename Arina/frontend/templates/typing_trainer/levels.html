<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Уровни — Клавиатурный тренажёр</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='typing_trainer/typing_trainer.css') }}">
</head>
<body>
    <div id="dateTimeBar"></div>
    <div class="container typing-container">
        <h1 class="typing-title">{{ layout_title }} — уровни</h1>
        <p class="typing-subtitle">Проходи уровни по порядку. Следующий уровень откроется после успешного прохождения предыдущего.</p>

        <div class="typing-layout-switch">
            <a class="typing-btn {% if layout_code == 'ru' %}blue-btn{% else %}orange-btn{% endif %}" href="/typing-trainer/levels?layout=ru&student={{ student }}">Русская</a>
            <a class="typing-btn {% if layout_code == 'en' %}blue-btn{% else %}orange-btn{% endif %}" href="/typing-trainer/levels?layout=en&student={{ student }}">Английская</a>
        </div>

        <div id="typingProgressState" class="typing-info-card">Загружаю прогресс...</div>
        <div id="typingLevelsGrid" class="typing-level-grid"></div>
        <div id="typingRecentAttempts" class="typing-info-card" style="display:none;"></div>

        <div class="typing-actions">
            <a href="/typing-trainer?student={{ student }}" class="typing-btn red-btn">Назад</a>
            <a id="typingAnimalLink" href="/typing-trainer/animal?layout={{ layout_code }}&student={{ student }}" class="typing-btn orange-btn">Выбрать зверька</a>
        </div>
    </div>

    <script>
        window.typingLevelsConfig = {
            layoutCode: {{ layout_code | tojson }},
            student: {{ student | tojson }},
            animals: {{ animals | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='typing_trainer/typing_trainer_levels.js') }}"></script>
</body>
</html>

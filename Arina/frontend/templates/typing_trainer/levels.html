<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клавиатурный тренажёр — мои уровни</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='typing_trainer/typing_trainer.css') }}">
</head>
<body>
    <div id="dateTimeBar"></div>
    <div class="container typing-container">
        <div class="typing-top-left-actions">
            <a href="/typing-trainer?student={{ student }}" class="typing-btn red-btn">Назад</a>
        </div>
        <h1 class="typing-title">Мои уровни — {{ layout_title }}</h1>
        <p class="typing-subtitle">Здесь показаны результаты прохождения, открытые уровни, лучшие показатели и последние попытки.</p>
        <div class="typing-layout-switch">
            <a href="/typing-trainer/levels?layout=ru&student={{ student }}" class="typing-btn {% if layout_code == 'ru' %}green-btn{% else %}blue-btn{% endif %}">Кириллица</a>
            <a href="/typing-trainer/levels?layout=en&student={{ student }}" class="typing-btn {% if layout_code == 'en' %}green-btn{% else %}blue-btn{% endif %}">Латиница</a>
        </div>
        <div id="typingAuthWarning" class="typing-warning" style="display:none;">Чтобы сохранять прогресс, нужно войти в аккаунт.</div>
        <div class="typing-progress-card" id="typingProgressCard">Загрузка прогресса...</div>
        <div class="typing-level-grid" id="typingLevelGrid"></div>
        <div class="typing-info-card">
            <h2>Последние попытки</h2>
            <div id="typingRecentAttempts">Пока нет сохранённых попыток.</div>
        </div>
    </div>
    <script>
        window.typingLevelsPageConfig = {
            layoutCode: {{ layout_code | tojson }},
            layoutTitle: {{ layout_title | tojson }},
            student: {{ student | tojson }},
            animals: {{ animals | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='typing_trainer/typing_trainer_levels.js') }}"></script>
</body>
</html>
